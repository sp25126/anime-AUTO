name: Daily Autonomous Anime Shorts Release (Remotion + FFmpeg Engine)

"on":
  schedule:
    # ── Slot 1: 1:30 PM IST (Target: 13:30 IST = 08:00 UTC) ──
    - cron: '0 8 * * *'    # 1:30 PM IST (Primary)
    - cron: '15 8 * * *'   # 1:45 PM IST (Retry 1)
    - cron: '30 8 * * *'   # 2:00 PM IST (Retry 2)

    # ── Slot 2: 8:30 PM IST (Target: 20:30 IST = 15:00 UTC) ──
    - cron: '0 15 * * *'   # 8:30 PM IST (Primary)
    - cron: '15 15 * * *'  # 8:45 PM IST (Retry 1)
    - cron: '30 15 * * *'  # 9:00 PM IST (Retry 2)
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  produce-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11 (For Jitter Guard & Production)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Determine Active Slot & Check If Already Executed"
        id: jitter_guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          CURRENT_HOUR_UTC=$(date -u +%H)
          CURRENT_MIN_UTC=$(date -u +%M)
          TOTAL_MINS=$(( (10#$CURRENT_HOUR_UTC * 60) + 10#$CURRENT_MIN_UTC + 330 ))
          IST_MINS=$(( TOTAL_MINS % 1440 ))
          IST_HOUR=$(( IST_MINS / 60 ))
          
          echo "Current IST Hour: $IST_HOUR"
          
          # Target 2 runs a day: Afternoon (1:30 PM IST) and Evening (8:30 PM IST)
          if [ "$IST_HOUR" -lt 17 ]; then
            SLOT="SLOT_AFTERNOON"
          else
            SLOT="SLOT_EVENING"
          fi
          
          echo "Evaluated Slot: $SLOT"
          python scripts/engine/check_scheduled_run.py "$SLOT"

      - name: Set up Node.js 20 (For Remotion React Engine)
        if: steps.jitter_guard.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies & FFmpeg
        if: steps.jitter_guard.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf libasound2t64 chromium-browser || sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install NPM & Remotion Dependencies
        if: steps.jitter_guard.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci || npm install

      - name: Install Python Dependencies
        if: steps.jitter_guard.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install -r requirements.txt

      - name: Restore YouTube Token Secret
        if: steps.jitter_guard.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p config
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > config/youtube_token.json
            echo "YouTube token restored successfully."
          else
            echo "WARNING: YOUTUBE_TOKEN_JSON secret is empty or missing in repo settings!"
          fi

      - name: Run Autonomous Production & Scheduling Cycle
        if: steps.jitter_guard.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -u scripts/engine/autonomous_channel_manager.py --upload

      - name: Commit & Persist Channel State Back to Repo
        if: (steps.jitter_guard.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch') && always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config/autonomous_state.json || true
          git diff --staged --quiet || (git commit -m "chore: advance autonomous rotation & scheduling state [skip ci]" && git push origin main)
