name: Daily Autonomous Anime Shorts Release (Remotion + FFmpeg Engine)

on:
  schedule:
    # Runs everyday at 2:00 AM IST (20:30 UTC)
    - cron: '30 20 * * *'
    # Also fallback trigger at 02:00 UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20 (For Remotion React Engine)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11 (For Autonomous Pipeline & DSP)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends ffmpeg libasound2t64 chromium-browser || sudo apt-get install -y ffmpeg

      - name: Install NPM & Remotion Dependencies
        run: |
          npm ci || npm install

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore YouTube Token Secret
        run: |
          mkdir -p config
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > config/youtube_token.json
            echo "YouTube token restored successfully."
          else
            echo "WARNING: YOUTUBE_TOKEN_JSON secret is empty or missing in repo settings!"
          fi

      - name: Schedule All Existing Master Outputs
        run: |
          python -u scripts/engine/batch_schedule_existing.py || true

      - name: Run Master Autonomous Pipeline & Schedule (Release window: 7:00 AM - 8:00 AM IST)
        run: |
          python -u scripts/engine/autonomous_channel_manager.py --upload

      - name: Persist Cycle State Back to Repo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config/autonomous_state.json config/scheduled_upload_registry.json || true
          git status
          git diff --staged --quiet || (git commit -m "chore: advance autonomous rotation & scheduling state [skip ci]" && git push origin main)
